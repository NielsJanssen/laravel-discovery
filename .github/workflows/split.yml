name: Split

on:
  push:
    branches: [ main ]
    tags: [ '*@v*' ]

env:
  GITHUB_TOKEN: ${{ secrets.SPLIT_ACCESS_TOKEN }}

jobs:
  split:
    name: Split packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: laravel-discovery
            split_repository: laravel-discovery-core

          - local_path: laravel-discovery-graphql
            split_repository: laravel-discovery-graphql

          - local_path: laravel-validation
            split_repository: laravel-validation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Branch push: mirror main into every split repository.
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          package_directory: packages/${{ matrix.package.local_path }}
          repository_organization: NielsJanssen
          repository_name: ${{ matrix.package.split_repository }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # Tag push: `<package>@vX.Y.Z` releases only that package, and the split
      # repository receives the bare `vX.Y.Z` tag.
      - name: Resolve package version from tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, format('{0}@v', matrix.package.local_path))
        run: echo "version=${GITHUB_REF_NAME#${{ matrix.package.local_path }}@}" >> "$GITHUB_OUTPUT"

      - if: steps.tag.outputs.version != ''
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          tag: ${{ steps.tag.outputs.version }}
          package_directory: packages/${{ matrix.package.local_path }}
          repository_organization: NielsJanssen
          repository_name: ${{ matrix.package.split_repository }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
